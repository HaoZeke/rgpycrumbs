# Input for scripts/llms/build_llms.py. It writes llms-full.txt at the
# repository root: every page of the manual in toctree order, converted
# from the Org sources under docs/orgmode/ to Markdown, then the skills.
# The map of the site, docs/source/llms.txt, is written by hand; [map]
# checks its links against the manual.

[project]
branch = "main"
full_note = "The pages follow in the order of the site's navigation."
links = "raw"
name = "rgpycrumbs"
notes = [
  "Every published page of https://rgpycrumbs.rgoswami.me/ follows, converted from its Org source to Markdown; each section names the address it was taken from. The map of the site is https://rgpycrumbs.rgoswami.me/llms.txt.",
  "`rgpycrumbs GROUP TOOL ARGS` runs one self-contained script, `rgpycrumbs/GROUP/TOOL.py` with dashes for underscores, under `uv run --script`, which installs the dependencies listed in the script's PEP 723 header. The installed package itself needs only click, numpy and rich.",
  "Worked tasks with runnable scripts are under `skills/` and are reproduced at the end.",
]
repo = "https://github.com/HaoZeke/rgpycrumbs"
summary = """
rgpycrumbs is a dispatcher-based suite of command-line tools and library
helpers for chemical physics: eOn NEB, minimization and saddle-search
figures, gradient-enhanced surface models, structure alignment and
fragments, ORCA and NWChem input, and UMA model packages.
"""

[output]
full  = "llms-full.txt"
index = ""

[docs]
index    = "index.org"
page_url = "https://rgpycrumbs.rgoswami.me/{page}"
root     = "docs/orgmode"

[map]
# Built by sphinx-autoapi from the package, not from Org.
generated = [ "autoapi/" ]
path      = "docs/source/llms.txt"
site      = "https://rgpycrumbs.rgoswami.me/"

[skills]
dir  = "skills"
full = true
