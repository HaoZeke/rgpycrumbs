name: Coverage
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on: [push, pull_request]
jobs:
  coverage:
    runs-on: ubuntu-22.04
    name: Combined coverage (pixi multi-env)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          activate-environment: false
      - name: Run test env
        shell: bash -el {0}
        run: |
          set -o pipefail
          pixi r -e test -- python -X faulthandler -m coverage run --data-file=.coverage.test --source=rgpycrumbs -m pytest tests/ -q 2>&1 | tee test-env.log
      - name: Run surfaces env
        shell: bash -el {0}
        run: |
          pixi r -e surfaces -- python -X faulthandler -m coverage run --data-file=.coverage.surfaces --source=rgpycrumbs -m pytest tests/ -m surfaces -q
      - name: Run fragments env
        shell: bash -el {0}
        run: |
          pixi r -e fragments -- python -X faulthandler -m coverage run --data-file=.coverage.fragments --source=rgpycrumbs -m pytest tests/ -m "fragments or ira or align" -q
      - name: Run eonmlflow env
        shell: bash -el {0}
        run: |
          pixi r -e eonmlflow -- python -X faulthandler -m coverage run --data-file=.coverage.eonmlflow --source=rgpycrumbs -m pytest tests/ -m eon -q
      - name: Combine and report
        shell: bash -el {0}
        run: |
          pixi r -e test -- python -m coverage combine .coverage.test .coverage.surfaces .coverage.fragments .coverage.eonmlflow
          pixi r -e test -- python -m coverage report --show-missing --precision=1 --fail-under=70
      - name: Upload test environment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-env-log
          path: test-env.log
          if-no-files-found: error
