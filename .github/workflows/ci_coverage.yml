name: Coverage
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on: [push, pull_request]
jobs:
  coverage:
    runs-on: ubuntu-22.04
    name: Combined coverage (pixi multi-env)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: false
          cache-write: false
          activate-environment: false
      - name: Run test env
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/.pixi/envs/test/lib:${LD_LIBRARY_PATH:-}"
          export QT_QPA_PLATFORM=offscreen
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software
          pixi r -e test -- python -c 'import ovito; from ovito.data import DataCollection; print(f"OVITO {ovito.version} {ovito.__file__}; DataCollection={DataCollection.__module__}.{DataCollection.__name__}")'
          set -o pipefail
          pixi r -e test -- python -X faulthandler -m coverage run --data-file=.coverage.test --source=rgpycrumbs -m pytest tests/ -q 2>&1 | tee test-env.log
      - name: Run surfaces env
        shell: bash -el {0}
        run: |
          set -o pipefail
          pixi r -e surfaces -- python -X faulthandler -m coverage run --data-file=.coverage.surfaces --source=rgpycrumbs -m pytest tests/ -m surfaces -q 2>&1 | tee surfaces-env.log
      - name: Run fragments env
        shell: bash -el {0}
        run: |
          set -o pipefail
          pixi r -e fragments -- python -X faulthandler -m coverage run --data-file=.coverage.fragments --source=rgpycrumbs -m pytest tests/ -m "fragments or ira or align" -q 2>&1 | tee fragments-env.log
      - name: Run eonmlflow env
        shell: bash -el {0}
        run: |
          set -o pipefail
          pixi r -e eonmlflow -- python -X faulthandler -m coverage run --data-file=.coverage.eonmlflow --source=rgpycrumbs -m pytest tests/ -m eon -q 2>&1 | tee eonmlflow-env.log
      - name: Combine and report
        shell: bash -el {0}
        run: |
          set -o pipefail
          { pixi r -e test -- python -m coverage combine .coverage.test .coverage.surfaces .coverage.fragments .coverage.eonmlflow && pixi r -e test -- python -m coverage report --show-missing --precision=1 --fail-under=70; } 2>&1 | tee combine-report.log
      - name: Upload coverage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs
          path: |
            *-env.log
            combine-report.log
          if-no-files-found: warn
