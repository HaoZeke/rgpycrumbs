name: Skills
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
jobs:
  skills:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: llms-full.txt matches the manual and the site map
        run: python scripts/llms/build_llms.py --check
      - name: Generator tests
        run: python -m unittest discover -s scripts/llms -p "test_*.py" -v
      - name: Skill frontmatter, script references and links
        run: python scripts/skills/run_skills.py --no-run
      - name: Dispatcher and add-tool skills
        run: |
          uv sync
          uv run python scripts/skills/run_skills.py --only rgpycrumbs-cli --only rgpycrumbs-add-tool
      # The plot stack from PyPI, so plt-neb runs in place and readcon is
      # not built from git.
      - name: NEB plotting skill
        run: >-
          uv run --with "chemparseplot[neb,plot]>=1.13" --with "readcon>=0.17.1"
          --with matplotlib --with scipy --with jax --with "adjustText>=1.0"
          --with cmcrameri --with ase --with polars --with h5py
          --with "xyzrender>=0.1.3"
          python scripts/skills/run_skills.py --only rgpycrumbs-neb-plots
