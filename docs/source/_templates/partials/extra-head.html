<!-- Manual favicon handling with favicon.io -->
<!-- since sphinx-favicon doesn't work with shibuya -->
<link rel="icon" type="image/png" sizes="16x16" href="{{ pathto('_static/favicons/favicon-16x16.png', 1) }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ pathto('_static/favicons/favicon-32x32.png', 1) }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ pathto('_static/favicons/android-chrome-192x192.png', 1) }}">
<link rel="icon" type="image/png" sizes="512x512" href="{{ pathto('_static/favicons/android-chrome-512x512.png', 1) }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ pathto('_static/favicons/apple-touch-icon.png', 1) }}">
<link rel="shortcut icon" href="{{ pathto('_static/favicons/favicon.ico', 1) }}">
<link rel="manifest" href="{{ pathto('_static/favicons/site.webmanifest', 1) }}">
<!-- Antics analytics -->
<script defer src="https://antics-api.turtletech.us/antics.js"></script>
<script>window.antics=window.antics||{event:function(){}};document.addEventListener('click',function(e){var a=e.target.closest('a');if(a&&a.hostname&&a.hostname!==location.hostname)antics.event('Outbound Link',{url:a.href})});</script>
